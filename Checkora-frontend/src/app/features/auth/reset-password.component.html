<main>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="on">
    <span>CHECKORA</span>
    <h1>Elige una nueva contraseña</h1>
    <p>Usa al menos 12 caracteres.</p>

    <label for="new-password">
      Nueva contraseña
      <input
        id="new-password"
        type="password"
        name="new-password"
        formControlName="password"
        autocomplete="new-password"
      />
    </label>

    <label for="confirmation-password">
      Repite la contraseña
      <input
        id="confirmation-password"
        type="password"
        name="confirmation-password"
        formControlName="confirmation"
        autocomplete="new-password"
      />
    </label>

    @if (error()) {
      <p role="alert" aria-live="assertive">{{ error() }}</p>
    }

    <button tuiButton type="submit">Guardar contraseña</button>
    <a routerLink="/login">Volver a iniciar sesión</a>
  </form>
</main>
