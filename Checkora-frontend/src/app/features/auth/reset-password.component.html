<main>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="on" novalidate>
    <span>CHECKORA</span>
    <h1>Elige una nueva contraseña</h1>
    <p>Usa entre 12 y 128 caracteres.</p>

    <label for="new-password">
      Nueva contraseña
      <input
        id="new-password"
        type="password"
        name="new-password"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        aria-describedby="password-help"
      />
    </label>
    <small id="password-help">Mínimo 12 caracteres.</small>

    <label for="confirmation-password">
      Repite la contraseña
      <input
        id="confirmation-password"
        type="password"
        name="confirmation-password"
        formControlName="confirmation"
        autocomplete="new-password"
        [attr.aria-invalid]="form.controls.confirmation.invalid && form.controls.confirmation.touched"
      />
    </label>

    @if (error()) {
      <p role="alert" aria-live="assertive">{{ error() }}</p>
    }

    <button tuiButton type="submit" [disabled]="saving()">
      @if (saving()) {
        <tui-loader size="s" [inheritColor]="true"></tui-loader>
        Guardando…
      } @else {
        Guardar contraseña
      }
    </button>
    <a routerLink="/login">Volver a iniciar sesión</a>
  </form>
</main>
