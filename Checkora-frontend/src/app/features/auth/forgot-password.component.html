<main>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="on">
    <span>CHECKORA</span>
    <h1>Recupera tu contraseña</h1>

    @if (submitted()) {
      <p class="success" role="status">
        Si existe una cuenta con este correo, recibirás un enlace para restablecer la contraseña.
      </p>
    } @else {
      <p>Indica el correo de tu cuenta y te enviaremos un enlace seguro.</p>
      <label for="recovery-email">
        Email
        <input
          id="recovery-email"
          type="email"
          name="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
        />
      </label>

      @if (error()) {
        <p role="alert" aria-live="assertive">{{ error() }}</p>
      }

      <button tuiButton type="submit" [disabled]="loading()" [attr.aria-busy]="loading()">
        @if (loading()) {
          <tui-loader size="s" [inheritColor]="true"></tui-loader>
          Enviando…
        } @else {
          Enviar enlace
        }
      </button>
    }

    <a routerLink="/login">Volver a iniciar sesión</a>
  </form>
</main>
