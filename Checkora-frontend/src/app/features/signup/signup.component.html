<main><form [formGroup]="form" (ngSubmit)="submit()"><span>CHECKORA</span><h1>Crear cuenta</h1><label>Nombre<input formControlName="name" /></label><label>Email<input type="email" formControlName="email" /></label><label>Contraseña<input type="password" formControlName="password" /></label><p>La contraseña debe tener al menos 12 caracteres.</p>@if(error()){<p role="alert">{{error()}}</p>}<button tuiButton type="submit" [disabled]="saving()" [attr.aria-busy]="saving()">@if(saving()){<tui-loader size="s" [inheritColor]="true"></tui-loader>Creando cuenta…} @else {Crear cuenta}</button></form></main>
