<main class="page"><header><span>CHECKORA</span><h1>Registro de huésped</h1><p>Completa tus datos para formalizar tu estancia.</p></header><form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate><section><h2>Datos personales</h2><div class="grid"><label>Email *<input type="email" formControlName="email" /></label><label>Teléfono móvil *<input type="tel" formControlName="mobilePhone" /></label><label>Nombre *<input formControlName="firstName" /></label><label>Primer apellido *<input formControlName="firstSurname" /></label><label>Segundo apellido<input formControlName="secondSurname" /></label><label>Sexo *<select formControlName="gender"><option value="">Selecciona</option><option value="female">Mujer</option><option value="male">Hombre</option><option value="other">Otro / no indicar</option></select></label><label>Nacionalidad *<input formControlName="nationality" /></label><label>Fecha de nacimiento *<input type="date" formControlName="birthDate" /></label></div></section><section><h2>Documento de identidad</h2><div class="grid"><label>Tipo de documento *<select formControlName="documentType"><option value="">Selecciona</option><option value="dni">DNI</option><option value="nie">NIE</option><option value="passport">Pasaporte</option><option value="other">Otro</option></select></label><label>Número de documento *<input formControlName="documentNumber" /></label><label>Número de soporte<input formControlName="documentSupportNumber" /></label></div></section><section><h2>Residencia habitual</h2><div class="grid"><label>Lugar de residencia habitual *<input formControlName="habitualResidence" /></label><label>Dirección *<input formControlName="address" /></label><label>Código postal *<input formControlName="postalCode" /></label><label>Municipio *<input formControlName="municipality" /></label></div></section><section><h2>Firma</h2><p>Dibuja tu firma con el ratón o el dedo.</p><canvas #signatureCanvas class="signature" width="700" height="180" aria-label="Área para firmar" (pointerdown)="begin($event)" (pointermove)="draw($event)" (pointerup)="end()" (pointerleave)="end()"></canvas><button tuiButton type="button" appearance="flat" (click)="clear()">Borrar firma</button></section><label><input type="checkbox" formControlName="privacyAccepted" /> Acepto la política de privacidad. *</label><button tuiButton type="submit" size="l">Enviar registro</button></form></main>
